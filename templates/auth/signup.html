{% extends "base.html" %}
{% block title %}Create Account | ExpenseHub{% endblock %}
{% block content %}
<style>.signup-page{width:100%;max-width:520px;margin:0 auto}.signup-card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 20px 55px rgba(15,23,42,.10);overflow:hidden}.signup-top{text-align:center;padding:30px 32px 18px}.signup-logo{width:60px;height:60px;margin:0 auto 16px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 12px 28px rgba(79,70,229,.25);font-size:1.45rem}.signup-title{margin:0;color:#111827;font-size:1.65rem;font-weight:850;letter-spacing:-.03em}.signup-sub{margin:7px 0 0;color:#6b7280;font-size:.83rem}.signup-body{padding:8px 32px 30px}.signup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.signup-field{margin-bottom:14px}.signup-label{display:block;margin-bottom:6px;color:#374151;font-size:.77rem;font-weight:750}.signup-input{width:100%;min-height:45px;border:1px solid #dbe1ea;border-radius:10px;padding:10px 12px;font-size:.84rem}.signup-input:focus{outline:none;border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(79,70,229,.1)}.signup-button{width:100%;min-height:48px;border:0;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#6d28d9);color:#fff;font-weight:800;box-shadow:0 10px 22px rgba(79,70,229,.22)}.signup-footer{text-align:center;color:#94a3b8;font-size:.75rem;margin-top:16px}.signup-footer a{color:#4f46e5;font-weight:750}@media(max-width:560px){.signup-grid{grid-template-columns:1fr}.signup-top,.signup-body{padding-left:22px;padding-right:22px}}</style>
<div class="signup-page"><div class="signup-card"><div class="signup-top"><div class="signup-logo"><i class="bi bi-person-plus"></i></div><h1 class="signup-title">Create your account</h1><p class="signup-sub">Join the ExpenseHub workspace</p></div><div class="signup-body"><form method="POST" action="{{ url_for('auth.signup') }}"><div class="signup-grid"><div class="signup-field"><label class="signup-label" for="name">Full name</label><input class="signup-input" id="name" name="name" value="{{ form.get('name','') }}" placeholder="Your name" required autofocus></div><div class="signup-field"><label class="signup-label" for="email">Email address</label><input class="signup-input" id="email" name="email" type="email" value="{{ form.get('email','') }}" placeholder="you@company.com" required></div></div><div class="signup-field"><label class="signup-label" for="department">Department</label><input class="signup-input" id="department" name="department" value="{{ form.get('department','') }}" placeholder="Engineering, Finance, HR..." required></div><div class="signup-field"><label class="signup-label" for="role">Role</label><select class="signup-input" id="role" name="role" required><option value="employee" {% if form.get('role','employee')=='employee' %}selected{% endif %}>Employee</option><option value="admin" {% if form.get('role')=='admin' %}selected{% endif %}>Admin</option></select></div><div class="signup-grid"><div class="signup-field"><label class="signup-label" for="password">Password</label><input class="signup-input" id="password" name="password" type="password" required minlength="6"></div><div class="signup-field"><label class="signup-label" for="confirm_password">Confirm password</label><input class="signup-input" id="confirm_password" name="confirm_password" type="password" required minlength="6"></div></div><button class="signup-button" type="submit"><i class="bi bi-person-check me-2"></i>Create account</button></form><div class="signup-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></div></div></div></div>
{% endblock %}
