{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1>Department Management</h1>

    <form method="post">
        <input name="name" placeholder="Department name" required>
        <input name="monthly_budget" type="number" step="0.01" placeholder="Monthly budget">
        <select name="manager_id">
            <option value="">No manager</option>
            {% for manager in managers %}
            <option value="{{ manager.id }}">{{ manager.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Create Department</button>
    </form>

    {% if departments %}
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Budget</th><th>Manager</th></tr></thead>
        <tbody>
        {% for dept in departments %}
            <tr>
                <td>{{ dept.id }}</td>
                <td>{{ dept.name }}</td>
                <td>{{ dept.monthly_budget }}</td>
                <td>{{ dept.manager_id }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% endif %}
</div>
{% endblock %}
